name: Build Flutter APK

on:
  push:
    branches: [main, master]
    paths:
      - 'gsr_app/**'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: gsr_app
        run: flutter pub get

      - name: Build debug APK
        working-directory: gsr_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSR-debug-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Distribute via Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: gsr_app/build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
