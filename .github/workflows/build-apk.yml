name: Build Flutter APK

on:
  push:
    branches: [main, master]
    paths:
      - 'gsr_app/**'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: gsr_app
        run: flutter pub get

      - name: Show resolved dependency versions
        working-directory: gsr_app
        run: |
          echo "=== shared_preferences versions ==="
          grep -A3 "shared_preferences" pubspec.lock || echo "(not in lock file)"
          echo "=== full pubspec.lock ==="
          cat pubspec.lock

      - name: Generate launcher icons
        working-directory: gsr_app
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/bossbite-release.jks

      # ── Admin APK (Gurpreet only — KYC & approvals) ───────────────────
      - name: Build Admin APK
        working-directory: gsr_app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/bossbite-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor admin --dart-define=APP_FLAVOR=admin

      - name: Rename Admin APK
        run: cp gsr_app/build/app/outputs/flutter-apk/app-admin-release.apk gsr_app/build/app/outputs/flutter-apk/BossBite-Admin.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBite-Admin-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/BossBite-Admin.apk
          retention-days: 3

      # ── Restaurant Owner APK (share to restaurant owners) ────────────────────────
      - name: Build Restaurant Owner APK
        working-directory: gsr_app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/bossbite-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor owner --dart-define=APP_FLAVOR=owner

      - name: Rename Restaurant Owner APK
        run: cp gsr_app/build/app/outputs/flutter-apk/app-owner-release.apk gsr_app/build/app/outputs/flutter-apk/BossBite-Restaurant-Owner.apk

      - name: Upload Restaurant Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBite-Restaurant-Owner-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/BossBite-Restaurant-Owner.apk
          retention-days: 3

      # ── Application Users APK (app-store ready for end users) ──────────────────
      - name: Build Application Users APK
        working-directory: gsr_app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/bossbite-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor customer --dart-define=APP_FLAVOR=customer

      - name: Rename Application Users APK
        run: cp gsr_app/build/app/outputs/flutter-apk/app-customer-release.apk gsr_app/build/app/outputs/flutter-apk/BossBite-ApplicationUsers.apk

      - name: Upload Application Users APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBite-ApplicationUsers-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/BossBite-ApplicationUsers.apk
          retention-days: 3

      # ── Rider APK (delivery partner app) ────────────────────────────────────
      - name: Build Rider APK
        working-directory: gsr_app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/bossbite-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --flavor rider --dart-define=APP_FLAVOR=rider

      - name: Rename Rider APK
        run: cp gsr_app/build/app/outputs/flutter-apk/app-rider-release.apk gsr_app/build/app/outputs/flutter-apk/BossBite-Rider.apk

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBite-Rider-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/BossBite-Rider.apk
          retention-days: 3
