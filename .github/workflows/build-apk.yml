name: Build Flutter APK

on:
  push:
    branches: [main, master]
    paths:
      - 'gsr_app/**'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: gsr_app
        run: flutter pub get

      - name: Build debug APK
        working-directory: gsr_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSR-debug-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
