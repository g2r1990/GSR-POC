name: Build Flutter APK

on:
  push:
    branches: [main, master]
    paths:
      - 'gsr_app/**'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: gsr_app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: gsr_app
        run: dart run flutter_launcher_icons

      # ── Admin APK (Gurpreet only — KYC & approvals) ───────────────────
      - name: Build Admin APK
        working-directory: gsr_app
        run: flutter build apk --debug --dart-define=APP_FLAVOR=admin

      - name: Rename Admin APK
        run: cp gsr_app/build/app/outputs/flutter-apk/app-debug.apk gsr_app/build/app/outputs/flutter-apk/BossBite-Admin.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBite-Admin-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/BossBite-Admin.apk
          retention-days: 3

      # ── Restaurant Owner APK (share to restaurant owners) ────────────────────────
      - name: Build Restaurant Owner APK
        working-directory: gsr_app
        run: flutter build apk --debug --dart-define=APP_FLAVOR=owner

      - name: Rename Restaurant Owner APK
        run: cp gsr_app/build/app/outputs/flutter-apk/app-debug.apk gsr_app/build/app/outputs/flutter-apk/BossBite-Restaurant-Owner.apk

      - name: Upload Restaurant Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBite-Restaurant-Owner-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/BossBite-Restaurant-Owner.apk
          retention-days: 3

      # ── Application Users APK (app-store ready for end users) ──────────────────
      - name: Build Application Users APK
        working-directory: gsr_app
        run: flutter build apk --debug --dart-define=APP_FLAVOR=customer

      - name: Rename Application Users APK
        run: cp gsr_app/build/app/outputs/flutter-apk/app-debug.apk gsr_app/build/app/outputs/flutter-apk/BossBite-ApplicationUsers.apk

      - name: Upload Application Users APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBite-ApplicationUsers-${{ github.run_number }}
          path: gsr_app/build/app/outputs/flutter-apk/BossBite-ApplicationUsers.apk
          retention-days: 3
