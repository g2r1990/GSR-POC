services:
  db:
    image: postgres:16-alpine
    container_name: gsr_db
    restart: always
    environment:
      POSTGRES_DB: gsr_db
      POSTGRES_USER: gsr_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsr_user -d gsr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gsr_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://gsr_user:${DB_PASSWORD}@db:5432/gsr_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
